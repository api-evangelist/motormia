name: MotorMia
description: >-
  MotorMia is an AI-powered automotive platform for car enthusiasts, built around
  Mia, an AI modding partner, build advisor, and performance analyst. Users add
  their vehicles, set build and performance goals, and Mia returns personalized
  upgrade recommendations across engine, transmission, brakes, suspension, cooling,
  and exhaust systems, tuned to the user's level of mechanical experience. The
  platform is backed by a proprietary automotive intelligence dataset combining
  over 5 million aftermarket parts, more than 50 million fitment records, and
  real-world enthusiast build behavior from 1M+ community projects, and ships as
  iOS and Android mobile apps plus a web store. Founded in 2023 and headquartered
  in Scottsdale, Arizona, MotorMia raised $8M led by investors including Lerer
  Hippeau and Seedcamp. As of this profile MotorMia is a consumer mobile product
  and publishes no public developer API, documentation, or specification surface.
